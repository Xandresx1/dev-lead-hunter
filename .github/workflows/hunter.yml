# ============================================================================
#  Dev Lead Hunter - GitHub Actions como MOTOR PRINCIPAL del bot
#
#  Corre cada 20 min (GitHub suele retrasarlo 5-30 min; en repos publicos los
#  minutos son ilimitados). En cada corrida el bot ejecuta SOLO las fuentes a las
#  que ya les toca segun su intervalo (guardado en data/state.json):
#     - Freelancer.com      -> en cada corrida (gratis)
#     - Reddit              -> cada 20 min (gratis; suele dar 403 desde runners, se omite solo)
#     - Facebook GRUPOS     -> cada 6 h via Bright Data (~$0.0015/post, 5000 creditos gratis/mes)
#     - Facebook BUSQUEDA   -> cada 12 h via Apify (keyword search en todo Facebook)
#     - LinkedIn            -> cada 12 h (Apify, desactivado por defecto)
#     - X / Twitter         -> cada 16 h (Apify, gratis, ~45 runs/mes)
#  El bot consulta el gasto real de Apify y deja de llamarlo al pasar APIFY_MONTHLY_BUDGET_USD;
#  para Bright Data lleva un contador de registros/mes y se detiene en BRIGHTDATA_MONTHLY_RECORDS.
#
#  Configuracion necesaria en el repo (Settings -> Secrets and variables -> Actions):
#    Secrets: GEMINI_API_KEY, APIFY_TOKEN, BRIGHTDATA_API_TOKEN, NTFY_TOPIC, OXION_API_KEY
#    Variables (opcionales, para afinar sin tocar codigo): BRIGHTDATA_GROUPS, FACEBOOK_GROUPS,
#      LINKEDIN_KEYWORDS, MIN_SCORE, APIFY_MONTHLY_BUDGET_USD, BRIGHTDATA_INTERVAL_MINUTES, ...
#  Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions"
#  (para que pueda guardar data/state.json = memoria de posts ya vistos).
#
#  Para PAUSAR el bot: pestana Actions -> "dev-lead-hunter" -> "..." -> Disable workflow.
# ============================================================================
name: dev-lead-hunter

on:
  schedule:
    - cron: "*/20 * * * *"     # cada 20 min (hora UTC)
  workflow_dispatch:
    inputs:
      sources:
        description: "Fuentes (vacio = las que toquen). Ej: freelancer,facebook"
        required: false
        default: ""
      force:
        description: "Forzar TODAS las fuentes ignorando intervalos (gasta Apify)"
        type: boolean
        default: false

concurrency:
  group: dev-lead-hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          # --- Secrets ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OXION_API_KEY: ${{ secrets.OXION_API_KEY }}
          # --- Propuestas automaticas (Claude via Oxion) y paginas con boton Copiar ---
          OXION_MODEL: ${{ vars.OXION_MODEL || 'claude-sonnet-5' }}
          PROPOSAL_SOURCES: ${{ vars.PROPOSAL_SOURCES || 'freelancer' }}
          PROPOSAL_LANGUAGES: ${{ vars.PROPOSAL_LANGUAGES || 'es' }}
          PROPOSAL_EXPERIENCE: ${{ vars.PROPOSAL_EXPERIENCE || '' }}
          EXCLUDED_CURRENCIES: ${{ vars.EXCLUDED_CURRENCIES || 'INR' }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PAGES_DIR: ./docs
          # --- Variables opcionales (Settings -> Variables). Si no existen se usa el valor por defecto ---
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '90' }}
          MAX_CLASSIFY_PER_TICK: ${{ vars.MAX_CLASSIFY_PER_TICK || '60' }}
          APIFY_MONTHLY_BUDGET_USD: ${{ vars.APIFY_MONTHLY_BUDGET_USD || '4.5' }}
          FREELANCER_ENABLED: ${{ vars.FREELANCER_ENABLED || 'true' }}
          FREELANCER_INTERVAL_MINUTES: ${{ vars.FREELANCER_INTERVAL_MINUTES || '1' }}
          REDDIT_ENABLED: ${{ vars.REDDIT_ENABLED || 'true' }}
          # Grupos de Facebook via Bright Data (Web Scraper API). 6 grupos x 4 posts x 4 veces/dia = ~2900 registros/mes (~$4.3 de los $5 gratis)
          BRIGHTDATA_ENABLED: ${{ vars.BRIGHTDATA_ENABLED || 'true' }}
          BRIGHTDATA_INTERVAL_MINUTES: ${{ vars.BRIGHTDATA_INTERVAL_MINUTES || '360' }}
          BRIGHTDATA_GROUPS: ${{ vars.BRIGHTDATA_GROUPS || 'https://www.facebook.com/groups/280022727038494,https://www.facebook.com/groups/660236834107139,https://www.facebook.com/groups/327987354235895,https://www.facebook.com/groups/desarrolladorweb,https://www.facebook.com/groups/266641914362970,https://www.facebook.com/groups/164148235452561' }}
          BRIGHTDATA_POSTS_PER_GROUP: ${{ vars.BRIGHTDATA_POSTS_PER_GROUP || '4' }}
          BRIGHTDATA_DAYS_BACK: ${{ vars.BRIGHTDATA_DAYS_BACK || '1' }}
          BRIGHTDATA_MONTHLY_RECORDS: ${{ vars.BRIGHTDATA_MONTHLY_RECORDS || '3000' }}
          BRIGHTDATA_WAIT_SECONDS: ${{ vars.BRIGHTDATA_WAIT_SECONDS || '420' }}
          # Grupos de Facebook via Apify: APAGADO por defecto (Bright Data ya cubre los grupos y cuesta 3x menos por post)
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED || 'false' }}
          FACEBOOK_INTERVAL_MINUTES: ${{ vars.FACEBOOK_INTERVAL_MINUTES || '1440' }}
          FACEBOOK_GROUPS: ${{ vars.FACEBOOK_GROUPS || 'https://www.facebook.com/groups/3355006434797472/,https://www.facebook.com/groups/660236834107139/,https://www.facebook.com/groups/3196840540371041/,https://www.facebook.com/groups/pe.emprendedores/' }}
          FACEBOOK_POSTS_PER_GROUP: ${{ vars.FACEBOOK_POSTS_PER_GROUP || '4' }}
          FACEBOOK_NEWER_THAN: ${{ vars.FACEBOOK_NEWER_THAN || '1 day' }}
          # Busqueda por palabra clave en TODO Facebook (la fuente mas directa: "busco programador", "necesito un sistema"...)
          FACEBOOK_SEARCH_ENABLED: ${{ vars.FACEBOOK_SEARCH_ENABLED || 'true' }}
          FACEBOOK_SEARCH_INTERVAL_MINUTES: ${{ vars.FACEBOOK_SEARCH_INTERVAL_MINUTES || '720' }}
          FACEBOOK_SEARCH_QUERIES: ${{ vars.FACEBOOK_SEARCH_QUERIES || 'busco programador,necesito un programador,busco desarrollador,necesito un sistema para mi negocio,quien me puede hacer una pagina web,necesito una app para mi negocio' }}
          FACEBOOK_SEARCH_RESULTS: ${{ vars.FACEBOOK_SEARCH_RESULTS || '5' }}
          LINKEDIN_ENABLED: ${{ vars.LINKEDIN_ENABLED || 'false' }}
          LINKEDIN_INTERVAL_MINUTES: ${{ vars.LINKEDIN_INTERVAL_MINUTES || '720' }}
          LINKEDIN_KEYWORDS: ${{ vars.LINKEDIN_KEYWORDS || 'busco desarrollador,necesito un sistema' }}
          TWITTER_ENABLED: ${{ vars.TWITTER_ENABLED || 'true' }}
          TWITTER_INTERVAL_MINUTES: ${{ vars.TWITTER_INTERVAL_MINUTES || '960' }}
          DATA_DIR: ./data
          TZ: America/Lima
        run: |
          mkdir -p data
          ARGS="--once --state-json data/state.json"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          echo "python main.py $ARGS"
          python main.py $ARGS

      - name: Guardar memoria del bot (data/state.json) y paginas (docs/)
        if: always()
        run: |
          git config user.name "dev-lead-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json docs || true
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore: memoria del bot [skip ci]"
            # si otra corrida empujo antes, rebase y reintenta
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
