# ============================================================================
#  Dev Lead Hunter - GitHub Actions como MOTOR PRINCIPAL del bot
#
#  Corre cada 20 min (GitHub suele retrasarlo 5-30 min; en repos publicos los
#  minutos son ilimitados). En cada corrida el bot ejecuta SOLO las fuentes a las
#  que ya les toca segun su intervalo (guardado en data/state.json):
#     - Freelancer.com -> en cada corrida (gratis)
#     - Reddit         -> cada 20 min (gratis; suele dar 403 desde runners, se omite solo)
#     - Facebook       -> cada 12 h   (Apify ~$0.02/run)
#     - LinkedIn       -> cada 12 h   (Apify ~$0.024/run)
#     - X / Twitter    -> cada 16 h   (Apify, gratis, ~45 runs/mes)
#  Total Apify estimado: ~$3/mes (dentro de los $5 gratis). El bot ademas consulta
#  tu gasto real y deja de llamar a Apify al pasar APIFY_MONTHLY_BUDGET_USD.
#
#  Configuracion necesaria en el repo (Settings -> Secrets and variables -> Actions):
#    Secrets: GEMINI_API_KEY, APIFY_TOKEN, NTFY_TOPIC
#    Variables (opcionales, para afinar sin tocar codigo): FACEBOOK_GROUPS,
#      LINKEDIN_KEYWORDS, MIN_SCORE, APIFY_MONTHLY_BUDGET_USD, FACEBOOK_INTERVAL_MINUTES, ...
#  Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions"
#  (para que pueda guardar data/state.json = memoria de posts ya vistos).
#
#  Para PAUSAR el bot: pestana Actions -> "dev-lead-hunter" -> "..." -> Disable workflow.
# ============================================================================
name: dev-lead-hunter

on:
  schedule:
    - cron: "*/20 * * * *"     # cada 20 min (hora UTC)
  workflow_dispatch:
    inputs:
      sources:
        description: "Fuentes (vacio = las que toquen). Ej: freelancer,facebook"
        required: false
        default: ""
      force:
        description: "Forzar TODAS las fuentes ignorando intervalos (gasta Apify)"
        type: boolean
        default: false

concurrency:
  group: dev-lead-hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          # --- Secrets ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # --- Variables opcionales (Settings -> Variables). Si no existen se usa el valor por defecto ---
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '65' }}
          MAX_CLASSIFY_PER_TICK: ${{ vars.MAX_CLASSIFY_PER_TICK || '60' }}
          APIFY_MONTHLY_BUDGET_USD: ${{ vars.APIFY_MONTHLY_BUDGET_USD || '4.5' }}
          FREELANCER_ENABLED: ${{ vars.FREELANCER_ENABLED || 'true' }}
          FREELANCER_INTERVAL_MINUTES: ${{ vars.FREELANCER_INTERVAL_MINUTES || '1' }}
          REDDIT_ENABLED: ${{ vars.REDDIT_ENABLED || 'true' }}
          FACEBOOK_ENABLED: ${{ vars.FACEBOOK_ENABLED || 'true' }}
          FACEBOOK_INTERVAL_MINUTES: ${{ vars.FACEBOOK_INTERVAL_MINUTES || '480' }}
          FACEBOOK_GROUPS: ${{ vars.FACEBOOK_GROUPS || 'https://www.facebook.com/groups/programadoresperu' }}
          FACEBOOK_POSTS_PER_GROUP: ${{ vars.FACEBOOK_POSTS_PER_GROUP || '5' }}
          LINKEDIN_ENABLED: ${{ vars.LINKEDIN_ENABLED || 'false' }}
          LINKEDIN_INTERVAL_MINUTES: ${{ vars.LINKEDIN_INTERVAL_MINUTES || '720' }}
          LINKEDIN_KEYWORDS: ${{ vars.LINKEDIN_KEYWORDS || 'busco desarrollador,necesito un sistema' }}
          TWITTER_ENABLED: ${{ vars.TWITTER_ENABLED || 'true' }}
          TWITTER_INTERVAL_MINUTES: ${{ vars.TWITTER_INTERVAL_MINUTES || '960' }}
          DATA_DIR: ./data
          TZ: America/Lima
        run: |
          mkdir -p data
          ARGS="--once --state-json data/state.json"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          echo "python main.py $ARGS"
          python main.py $ARGS

      - name: Guardar memoria del bot (data/state.json)
        if: always()
        run: |
          git config user.name "dev-lead-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore: memoria del bot [skip ci]"
            # si otra corrida empujo antes, rebase y reintenta
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
